services:
  db:
    image: postgres:16-alpine
    container_name: mini_ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mini_ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mini_ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
